<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TELA DE CADASTRO</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <fieldset>
        <legend>Cadastro</legend>

        <div>
            <label for="nome">Razão Social:</label>
            <input type="text" id="nome" name="nome" placeholder="Digite a razão social">
        </div>

        <div>
            <label for="cpf">CNPJ:</label>
            <input type="text" id="cpf" name="cnpj" placeholder="Digite o CNPJ">
        </div>

        <div>
            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email" placeholder="Digite o e-mail">
        </div>

        <button type="button" id="btnCadastrar">Finalizar cadastro</button>
    </fieldset>

    <div id="modalSucesso" class="modal hidden" aria-live="polite">
        <div class="modal-content">
            <p>Cadastro concluído</p>
            <button type="button" id="fecharModal">OK</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
